	LoadModule rewrite_module modules/mod_rewrite.so
	LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
	LoadModule proxy_http_module modules/mod_proxy_http.so
	LoadModule proxy_module modules/mod_proxy.so
	LoadModule ssl_module modules/mod_ssl.so

#	SetEnv proxy-initial-not-pooled 1

	ProxyPreserveHost On
	SSLProxyEngine on
	SSLProxyVerify none
	SSLProxyCheckPeerCN off
	SSLProxyCheckPeerName off

	RewriteEngine on
	RewriteCond %{HTTP:UPGRADE} ^WebSocket$ [NC,OR]
	RewriteCond %{HTTP:CONNECTION} ^Upgrade$ [NC]
	RewriteRule /!(ws/)(.*) https://127.0.0.1/$1 [P,L]
	ProxyPass /!(ws/)(.*) https://127.0.0.1/$1
	ProxyPassReverse /!(ws/)(.*) https://127.0.0.1/$1
	ProxyPass /ws/ wss://127.0.0.1:8009/ws/ 
#	upgrade=websocket
	ProxyPassReverse /ws/ wss://127.0.0.1:8009/ws/

	Header onsuccess unset Access-Control-Allow-Origin
#	Header always unset Access-Control-Allow-Origin
#	Header always unset Access-Control-Allow-Origin "https://lotteh.com"
	SetEnvIf Origin "^https?://[^/]*(lotteh\.com|glamgirlx\.com|damita\.transistor\.fm|thedamita\.transistor\.fm)$" ORIGIN=$0
	Header always set Access-Control-Allow-Origin %{ORIGIN}e env=ORIGIN
	Header always set Access-Control-Allow-Credentials "true" env=ORIGIN
	Header merge Vary Origin
	Header set X-Frame-Options ALLOWALL

#	Header set Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval';"

