	# processes=2 threads=4

	WSGIApplicationGroup %{GLOBAL}
	WSGIScriptAlias / /home/team/lotteh/lotteh/wsgi.py
	WSGIDaemonProcess lotteh header-buffer-size=32768 maximum-requests=1 inactivity-timeout=600 python-path=/home/team/lotteh/ python-home=/home/team/lotteh/venv user=team
	WSGIProcessGroup lotteh
	
	<Directory /home/team/lotteh/static>
		Options Indexes FollowSymLinks
		AllowOverride All
	</Directory>

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/lotteh.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/lotteh.com/privkey.pem

	Header set X-Frame-Options: "SAMEORIGIN"
	Header set Access-Control-Allow-Origin "https://lotteh.com"

	Timeout 600
	LimitRequestFieldSize 16384
        LimitRequestLine 16384
	LimitRequestBody 2147483647

	<FilesMatch ".(ico|pdf|flv|jpg|jpeg|png|gif|webp|JPG|JPEG|wav|mp3|mp4|public|css|swf|webp|svg|woff|woff2)$">
		Header set Cache-Control "max-age=30, public"
	</FilesMatch>

