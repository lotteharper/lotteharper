{% extends 'base.html' %}
{% load app_filters %}
{% block content %}
<h1>Phone Call Recordings</h1>
{% for url in urls %}
<p>From {{ url.0 }} ({{ url.4 }}) at {{ url.2 }} with duration {{ url.3 }} seconds</p>
<div>
    <audio controls src="{{ url.1 }}" style="width: 100%;">
        Your browser does not support the
        <code>audio</code> element.
    </audio>
</div> 
<hr>
{% endfor %}
{% endblock %}
